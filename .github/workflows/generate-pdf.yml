name: Generate Resume PDF
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run it manually

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the PDF back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Puppeteer
        run: |
          npm install puppeteer

      - name: Create PDF Generation Script
        run: |
          cat > generate-pdf.js << 'EOF'
          const puppeteer = require('puppeteer');
          const path = require('path');
          
          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            
            const htmlPath = path.resolve(__dirname, 'index.html');
            await page.goto('file://' + htmlPath, { waitUntil: 'networkidle0' });
            
            await page.pdf({
              path: 'resume.pdf',
              format: 'A4',
              printBackground: true,
              margin: { top: 0, right: 0, bottom: 0, left: 0 }
            });
            
            await browser.close();
            console.log('PDF generated successfully!');
          })();
          EOF

      - name: Generate PDF
        run: |
          node generate-pdf.js
          ls -lh resume.pdf

      - name: Commit and Push PDF
        run: |
          if [ -f resume.pdf ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add resume.pdf
            git diff --staged --quiet || git commit -m "chore: automated pdf generation"
            git push
          else
            echo "resume.pdf not found, skipping commit"
            exit 1
          fi
