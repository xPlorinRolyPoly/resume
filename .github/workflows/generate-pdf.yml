name: Generate Resume PDF
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run it manually

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the PDF back to the repo
    env:
      PDF_FILENAME: alpana-chaphalkar-resume.pdf
      HTML_FILENAME: index.html
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install jinja2 PyYAML

      - name: Render HTML from YAML
        run: python scripts/render.py

      - name: Install Puppeteer
        run: |
          npm install puppeteer

      - name: Generate PDF
        run: |
          node scripts/generate-pdf.js
          ls -lh ${{ env.PDF_FILENAME }}

      - name: Commit and Push Generated Files
        run: |
          if [ -f ${{ env.PDF_FILENAME }} ] && [ -f ${{ env.HTML_FILENAME }} ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add ${{ env.PDF_FILENAME }} ${{ env.HTML_FILENAME }}
            git diff --staged --quiet || git commit -m "chore: automated pdf and html generation"
            git push
          else
            echo "Generated files not found, skipping commit"
            [ ! -f ${{ env.PDF_FILENAME }} ] && echo "Missing: ${{ env.PDF_FILENAME }}"
            [ ! -f ${{ env.HTML_FILENAME }} ] && echo "Missing: ${{ env.HTML_FILENAME }}"
            exit 1
          fi
